# /etc/nginx/sites-available/vamos — proxy inverse HTTPS (certificat via certbot --nginx)
server {
    listen 80;
    server_name gestion.vamos-academy.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gestion.vamos-academy.tn;
    # ssl_certificate / ssl_certificate_key : ajoutés par certbot

    client_max_body_size 16m;          # justificatifs de dépenses (3 × 5 Mo)
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;             # utilisé par la limitation des tentatives de connexion
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
